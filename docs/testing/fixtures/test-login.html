<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      .form-group {
        margin: 15px 0;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
      }
      button {
        background: #007bff;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        margin: 10px 5px 10px 0;
      }
      button:hover {
        background: #0056b3;
      }
      .result {
        margin: 20px 0;
        padding: 15px;
        border-radius: 4px;
        white-space: pre-wrap;
      }
      .success {
        background: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
      }
      .error {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
      }
    </style>
  </head>
  <body>
    <h1>Login Test</h1>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" value="test@test.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" value="Test123!" required />
      </div>

      <button type="submit">Login</button>
      <button type="button" onclick="testConnection()">
        Test Server Connection
      </button>
    </form>

    <div id="result"></div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const resultDiv = document.getElementById("result");

          resultDiv.innerHTML = "Attempting login...";
          resultDiv.className = "result";

          try {
            const response = await fetch("/api/auth/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify({ email, password }),
            });

            const data = await response.json();

            resultDiv.innerHTML = `Status: ${response.status}
Response: ${JSON.stringify(data, null, 2)}`;

            if (data.success) {
              resultDiv.className = "result success";
              // Test if we can access a protected route
              setTimeout(testProtectedRoute, 1000);
            } else {
              resultDiv.className = "result error";
            }
          } catch (error) {
            resultDiv.innerHTML = `Error: ${error.message}`;
            resultDiv.className = "result error";
          }
        });

      async function testConnection() {
        const resultDiv = document.getElementById("result");
        resultDiv.innerHTML = "Testing server connection...";
        resultDiv.className = "result";

        try {
          const response = await fetch("/api/auth/me", {
            credentials: "include",
          });

          const data = await response.json();

          resultDiv.innerHTML = `Server Connection Test:
Status: ${response.status}
Response: ${JSON.stringify(data, null, 2)}`;

          if (response.ok) {
            resultDiv.className = "result success";
          } else {
            resultDiv.className = "result error";
          }
        } catch (error) {
          resultDiv.innerHTML = `Connection Error: ${error.message}`;
          resultDiv.className = "result error";
        }
      }

      async function testProtectedRoute() {
        try {
          const response = await fetch("/api/settings/profile", {
            credentials: "include",
          });

          const data = await response.json();
          const resultDiv = document.getElementById("result");

          resultDiv.innerHTML += `

Protected Route Test (/api/settings/profile):
Status: ${response.status}
Response: ${JSON.stringify(data, null, 2)}`;
        } catch (error) {
          console.error("Protected route test failed:", error);
        }
      }
    </script>
  </body>
</html>
