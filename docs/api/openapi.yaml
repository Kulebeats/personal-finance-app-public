  # Cron door (server/routes/cron.ts). Each route runs its catalogued jobs
  # through the scheduler's runner, under the same locks and journal, and
  # answers with one result per job: 200 when every job completed or its
  # period was already done; 409 when a job is skipped otherwise (period or
  # job lock held elsewhere, recovery window closed), retry later; 500 when a
  # job failed, its runner was unavailable, or its outcome is unknown.
  /api/cron/snapshots:
    post:
      tags: [Cron]
      summary: Run daily snapshots (snapshots.daily)
      operationId: runSnapshots
      security:
        - cronSecret: []
      responses:
        "200": { $ref: "#/components/responses/CronDoor" }
        "409": { $ref: "#/components/responses/CronDoor" }
        "500": { $ref: "#/components/responses/CronDoor" }
        default: { $ref: "#/components/responses/Error" }
  /api/cron/recurring:
    post:
      tags: [Cron]
      summary: Post due recurring transactions (recurring.materialize)
      operationId: runRecurringCron
      security:
        - cronSecret: []
      responses:
        "200": { $ref: "#/components/responses/CronDoor" }
        "409": { $ref: "#/components/responses/CronDoor" }
        "500": { $ref: "#/components/responses/CronDoor" }
        default: { $ref: "#/components/responses/Error" }
  /api/cron/recurring-reminders:
    post:
      tags: [Cron]
      summary: Send recurring bill reminders (recurring.remind)
      operationId: runRecurringRemindersCron
      security:
