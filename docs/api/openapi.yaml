        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
    cronSecret:
      type: apiKey
      in: header
      name: x-cron-secret
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema:
        type: string
    userIdParam:
      name: userId
      in: path
      required: true
      schema:
        type: string
  schemas:
    AuthLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        rememberMe:
          type: boolean
          default: false
    AuthRegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z0-9_-]+$"
        password:
          type: string
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          minLength: 1
          maxLength: 100
    AuthMfaVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 64
    AuthVerifyEmailRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    AuthResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
        - confirmPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 1
    CsrfTokenResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - csrfToken
          properties:
            csrfToken:
              type: string
    MoneyDto:
      type: object
      description: Money representation with string amount to avoid floating-point precision issues
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^-?\d+(\.\d{1,4})?$'
          example: "1234.56"
          description: Amount as string to preserve precision
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "ZMW"
          description: ISO 4217 currency code
    DecimalAmount:
      type: string
      pattern: '^-?\d+(\.\d{1,2})?$'
      description: Decimal string with up to 2 decimal places
    Pagination:
      type: object
      properties:
        total:
          type: number
        page:
          type: number
        pageSize:
          type: number
        totalPages:
          type: number
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
            - checking
            - savings
            - credit
            - cash
            - mobile_money
            - investment
            - loan
            - mortgage
            - other_liability
            - real_estate
            - vehicle
            - other
        subtype:
          type: string
          nullable: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
        balance:
          $ref: "#/components/schemas/DecimalAmount"
        initialBalance:
          $ref: "#/components/schemas/DecimalAmount"
        institution:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        isPrivate:
          type: boolean
        isHidden:
          type: boolean
        isArchived:
