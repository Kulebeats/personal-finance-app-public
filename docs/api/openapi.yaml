    CronDoor:
      description: One result per catalogued job of the route, in run order
      content:
        application/json:
          schema:
            type: object
            required: [success, jobs, timestamp]
            properties:
              success:
                type: boolean
                description: True only with status 200
              timestamp:
                type: string
                format: date-time
              jobs:
                type: array
                items:
                  type: object
                  required: [name, status]
                  properties:
                    name:
                      type: string
                      example: recurring.materialize
                    status:
                      type: string
                      enum: [completed, skipped, failed]
                    reason:
                      type: string
                      description: Set when skipped
                      enum: [PERIOD_DONE, PERIOD_HELD, JOB_BUSY, WINDOW_CLOSED]
                    errorCode:
                      type: string
                      description: >-
                        Set when failed. A bounded code, never a message: PARTIAL_FAILURE,
                        LOCK_LOST, JOB_RUNNER_UNAVAILABLE (lock or journal unavailable; the work
                        did not run), JOB_OUTCOME_UNKNOWN (the work ran but its journal row could
                        not be closed), JOB_FAILED, an application code, or PG_<sqlstate>.
                    summary:
                      type: object
                      nullable: true
                      additionalProperties:
                        type: number
                      description: The job's journal summary (counts only); null when the runner threw

