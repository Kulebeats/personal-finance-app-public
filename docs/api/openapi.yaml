openapi: 3.1.0
info:
  title: Personal Finance App API
  version: 0.1.0
  description: |
    Baseline OpenAPI 3.1 specification for the Personal Finance App.
    Paths are anchored at `/api/*` and are currently available under both
    `/api/*` and `/api/v1/*` via server-side routing.
    Schemas document the core client contract and allow additional fields
    for forward compatibility where appropriate.
servers:
  - url: http://localhost:5000
    description: Local development (supports /api/* and /api/v1/* aliases)
tags:
  - name: Auth
    description: Authentication and sessions
  - name: Settings
    description: User profile, display, notifications, and security settings
  - name: Household
    description: Household settings and membership
  - name: Accounts
  - name: Categories
  - name: Merchants
  - name: Rules
  - name: Reports
  - name: Transactions
  - name: Budgets
  - name: Goals
  - name: Recurring
  - name: Cron
  - name: Health
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/csrf-token:
    get:
      tags: [Auth]
      summary: Get CSRF token
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/HouseholdResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/mfa/verify:
    post:
      tags: [Auth]
      summary: Verify MFA during login
      operationId: verifyMfaLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthMfaVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/mfa/resend:
    post:
      tags: [Auth]
      summary: Resend MFA code
      operationId: resendMfaCode
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email address
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
