# Render Blueprint — Personal Finance App (SCP-306)
#
# Deploys the Express backend as a SINGLE Web Service. In production the same
# Node process serves the API and the built React client (see server/index-prod.ts),
# so there is no separate static host. Managed Postgres and Render Key Value are
# provisioned alongside it. Redis is required in production so rate limits
# and AI cost counters are cluster-wide if the service scales. Scheduler locks
# are Postgres advisory locks, never Redis keys: Key Value runs allkeys-lru,
# which may evict any key, so it holds no coordination state (OPS-013).
#
# Blueprint spec: https://render.com/docs/blueprint-spec
# After first deploy, confirm the assigned URL and update CLIENT_URL/APP_URL below
# if Render assigned a subdomain other than the service name. See docs/runbooks/deploy.md.

services:
  - type: web
    name: personal-finance-app
    runtime: node
    plan: starter # single instance; preDeployCommand requires Starter+
    region: oregon # choose the region nearest your users
    numInstances: 1 # single instance for v1
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate # apply versioned migrations before traffic shifts
    startCommand: npm run start
    # Readiness, not liveness: the database (and Redis when configured) must answer.
    # A stale scheduled job reports "degraded" with HTTP 200, so it never fails a deploy.
    healthCheckPath: /health/ready
    autoDeploy: true
    # Persistent disk for personal-data exports (R07.1): a ready export must
    # survive deploys and restarts for its 7-day download window. The export
    # directory is a sibling of the app's uploads/ root, never inside it, so
    # /uploads/* can never serve it. A disk keeps the service at one instance
    # and makes deploys stop-then-start (no zero-downtime overlap).
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Created at boot (mode 0700) by the app user; boot logs an error and
      # POST /api/settings/privacy/export answers 503 if it is not writable.
      - key: PERSONAL_EXPORT_DIR
        value: /var/data/personal-exports
      - key: NODE_VERSION
        value: 24.22.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Verify the database certificate and hostname (server/dbSsl.ts). This is
      # already the default; stating it keeps the policy explicit, and "false"
      # is rejected at boot.
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: personal-finance-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: personal-finance-cache
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # Render generates a strong secret (>32 chars)
      - key: CLIENT_URL
        value: https://personal-finance-app.onrender.com # update if Render assigns a different host
      - key: APP_URL
        value: https://personal-finance-app.onrender.com # update if Render assigns a different host
      # Scheduled jobs (OPS-003): this single instance runs every scheduled
      # financial job and the outbox processor in-process (server/scheduler.ts),
      # each under Postgres advisory locks (one per job, one per scheduled period,
      # renewed by a heartbeat), so no Render cron service is needed.
      - key: SCHEDULER_ENABLED
        value: "true"
      # Opens the HTTP /api/cron/* door; without it every request is refused (403).
      # Set CRON_HTTP_ENABLED=false to unmount the door instead.
      - key: CRON_SECRET
        generateValue: true
      # Optional feature vars — set in the Render dashboard when enabling each feature:
      #   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM  (email / weekly recap)
      #   ANTHROPIC_API_KEY, ANTHROPIC_MODEL, AI_ANTHROPIC_DAILY_CALL_CAP     (AI assistant, Claude primary)
      #   GEMINI_API_KEY, GEMINI_MODEL, AI_GEMINI_DAILY_CALL_CAP              (AI assistant, Gemini fallback)
      #   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY                                 (web push)
      #
      # Application and migration DB TLS verify certificates/hostnames by default.
      # If the provider needs a custom CA, add its PEM as a Secret File and set
      # DATABASE_SSL_CA_FILE to the mounted path (or use DATABASE_SSL_CA_CERT).
      # Insecure verification/plaintext production overrides are rejected.
      # Actual Render CA/hostname connectivity and staging smoke evidence remain
      # required before production enablement; local fixtures do not prove them.

  - type: keyvalue
    name: personal-finance-cache
    plan: starter
    region: oregon # MUST match the web service region for private networking
    maxmemoryPolicy: allkeys-lru

databases:
  - name: personal-finance-db
    plan: basic-256mb # smallest paid tier; `free` is available but expires after 90 days
    region: oregon # MUST match the web service region for private networking
    postgresMajorVersion: "18"
